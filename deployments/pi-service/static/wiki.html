<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wiki · Plane</title>
    <link rel="stylesheet" href="/cosmic-pilot/static/wiki.css?v=23" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          // Match host SPA theme when embedded; otherwise system preference.
          var host = null;
          try {
            host = window.parent && window.parent !== window ? window.parent.document.documentElement.getAttribute("data-theme") : null;
          } catch (_) {}
          var stored = null;
          try {
            stored = localStorage.getItem("theme");
          } catch (_) {}
          var t = host || stored || "system";
          if (t === "custom") t = "system";
          t = String(t).replace(/-custom$/, "");
          if (t === "system") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (String(t).indexOf("dark") === -1) t = "light";
          else t = "dark";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="wiki-app">
      <aside class="wiki-sidebar">
        <div class="wiki-sidebar-top">
          <div class="wiki-brand">
            <span class="wiki-mark">W</span>
            <span>Wiki</span>
          </div>
          <button type="button" id="new-page-btn" class="primary-btn">+ New page</button>
        </div>
        <div class="wiki-search-wrap">
          <input id="wiki-search" type="search" placeholder="Search pages…" />
        </div>
        <div class="wiki-page-list" id="page-list"></div>
        <div class="wiki-sidebar-foot">Workspace knowledge base</div>
      </aside>
      <main class="wiki-main">
        <div class="wiki-empty" id="empty-state">
          <h1>Company Wiki</h1>
          <p>Create and organize workspace pages — same surface as app.plane.so Wiki.</p>
          <button type="button" id="empty-new-btn" class="primary-btn">Create first page</button>
        </div>
        <div class="wiki-editor hidden" id="editor">
          <div class="wiki-toolbar">
            <input id="page-title" class="title-input" placeholder="Untitled" />
            <div class="toolbar-actions">
              <button type="button" id="save-btn" class="primary-btn">Save</button>
              <button type="button" id="delete-btn" class="ghost-btn danger">Delete</button>
            </div>
          </div>
          <textarea id="page-body" placeholder="Write anything…"></textarea>
          <div class="wiki-meta" id="page-meta"></div>
        </div>
      </main>
    </div>
    <script src="/cosmic-pilot/static/wiki.js?v=23"></script>
  </body>
</html>
