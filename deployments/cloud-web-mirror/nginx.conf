server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Commercial SPA assets (immutable hashed names)
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /manifest.json {
        try_files $uri =404;
    }

    location = /site.webmanifest.json {
        try_files $uri =404;
    }

    # SPA fallback — commercial React Router client handles /ai-chat etc.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
