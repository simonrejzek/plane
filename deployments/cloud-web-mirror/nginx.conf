server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Commercial SPA assets (immutable hashed names)
    # Hashed JS must not be immutable forever — same hash can be hotfixed in self-host builds
    location ~* ^/assets/.*\.js$ {
        try_files $uri =404;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        types { application/javascript js mjs; }
        default_type application/javascript;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        types {
            application/javascript js mjs;
            text/css css;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
            image/webp webp;
            image/gif gif;
            font/woff2 woff2;
            font/woff woff;
            application/json json;
        }
        # Ensure JS is never served as text/plain
        default_type application/javascript;
    }

    # Product tour / onboarding media (must NOT fall back to index.html)
    location /epic-migration/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        types {
            image/gif gif;
            image/webp webp;
            image/png png;
            image/jpeg jpg jpeg;
        }
        default_type application/octet-stream;
    }

    location = /manifest.json {
        try_files $uri =404;
    }

    location = /site.webmanifest.json {
        try_files $uri =404;
    }

    # SPA fallback — commercial React Router client handles /ai-chat etc.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
