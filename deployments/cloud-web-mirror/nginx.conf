server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Commercial SPA assets (immutable hashed names)
    # Hashed JS must not be immutable forever — same hash can be hotfixed in self-host builds
    location ~* ^/assets/.*\.js$ {
        try_files $uri =404;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        types { application/javascript js mjs; }
        default_type application/javascript;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        types {
            application/javascript js mjs;
            text/css css;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
            image/webp webp;
            image/gif gif;
            font/woff2 woff2;
            font/woff woff;
            application/json json;
        }
        # Do not force JS default — CSS/fonts under /assets must keep correct MIME
        default_type application/octet-stream;
    }

    # Product tour / onboarding media (must NOT fall back to index.html)
    location /epic-migration/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        types {
            image/gif gif;
            image/webp webp;
            image/png png;
            image/jpeg jpg jpeg;
        }
        default_type application/octet-stream;
    }

    # Home tip cards / marketing illustrations (must NOT SPA-fallback HTML)
    location /tips/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        types {
            image/gif gif;
            image/webp webp;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
        }
        default_type application/octet-stream;
    }

    # Product tour step media (work items / modules / cycles / pages)
    location /tour/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        types {
            image/gif gif;
            image/webp webp;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            application/json json;
            video/mp4 mp4;
        }
        default_type application/octet-stream;
    }

    # Fonts (Material Symbols etc.)
    location ~* ^/assets/.*\.(woff2?|ttf|otf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        types {
            font/woff2 woff2;
            font/woff woff;
            font/ttf ttf;
            font/otf otf;
        }
        default_type application/octet-stream;
    }

    location = /manifest.json {
        try_files $uri =404;
    }

    location = /site.webmanifest.json {
        try_files $uri =404;
    }

    # SPA fallback — commercial React Router client handles /ai-chat etc.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
