name: Build PI service image

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - "deployments/pi-service/**"
      - ".github/workflows/build-pi-service.yml"

jobs:
  build-pi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PI image
        uses: docker/build-push-action@v6
        with:
          context: deployments/pi-service
          file: deployments/pi-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plane-pi:cloud-mirror-v42
            ghcr.io/${{ github.repository_owner }}/plane-pi:cloud-mirror-v41
            ghcr.io/${{ github.repository_owner }}/plane-pi:commercial-compat-v11
            ghcr.io/${{ github.repository_owner }}/plane-pi:preview

      - name: Mirror to public ttl.sh
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/${{ github.repository_owner }}/plane-pi:cloud-mirror-v42
          docker tag ghcr.io/${{ github.repository_owner }}/plane-pi:cloud-mirror-v42 ttl.sh/cosmicboosts-plane-pi:cloud-mirror-v42
          docker tag ghcr.io/${{ github.repository_owner }}/plane-pi:cloud-mirror-v42 ttl.sh/cosmicboosts-plane-pi:cloud-mirror-v41
          docker tag ghcr.io/${{ github.repository_owner }}/plane-pi:cloud-mirror-v42 ttl.sh/cosmicboosts-plane-pi:commercial-compat-v11
          docker push ttl.sh/cosmicboosts-plane-pi:cloud-mirror-v42
          docker push ttl.sh/cosmicboosts-plane-pi:cloud-mirror-v41
          docker push ttl.sh/cosmicboosts-plane-pi:commercial-compat-v11