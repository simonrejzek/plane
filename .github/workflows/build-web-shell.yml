name: Build web shell image

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "apps/web/Dockerfile.web"
      - ".github/workflows/build-web-shell.yml"

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plane-web:shell-v3.4-classic
            ghcr.io/${{ github.repository_owner }}/plane-web:preview
          build-args: |
            BUILD_ID=cosmic-shell-v3.4-classic
            VITE_API_BASE_URL=
            VITE_WEB_BASE_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Host pull must work without auth for Dokploy
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OWNER="${{ github.repository_owner }}"
          PKG="plane-web"
          # user-owned package
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${PKG}" \
            -d '{"visibility":"public"}' \
            && echo "package set public" \
            || echo "visibility patch failed (may already be public or need UI)"

      - name: Also push to public ttl.sh (ephemeral, for host pull)
        run: |
          set -e
          # retag from local buildx cache is hard; re-pull from ghcr with GITHUB_TOKEN then push public
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/${{ github.repository_owner }}/plane-web:shell-v3.4-classic
          docker tag ghcr.io/${{ github.repository_owner }}/plane-web:shell-v3.4-classic ttl.sh/cosmicboosts-plane-web:shell-v3.4-classic
          docker push ttl.sh/cosmicboosts-plane-web:shell-v3.4-classic

