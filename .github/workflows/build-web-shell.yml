name: Build web shell image

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "apps/web/Dockerfile.web"
      - ".github/workflows/build-web-shell.yml"

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plane-web:shell-v3.0
            ghcr.io/${{ github.repository_owner }}/plane-web:preview
          build-args: |
            BUILD_ID=cosmic-shell-v3.0
            VITE_API_BASE_URL=
            VITE_WEB_BASE_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max
