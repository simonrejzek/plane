name: Build cloud web mirror image

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - "deployments/cloud-web-mirror/**"
      - ".github/workflows/build-cloud-web-mirror.yml"

jobs:
  build-mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch commercial assets + build index
        working-directory: deployments/cloud-web-mirror
        run: |
          export CLOUD_MIRROR_RELEASE="r-${GITHUB_SHA::12}"
          echo "CLOUD_MIRROR_RELEASE=$CLOUD_MIRROR_RELEASE" >> "$GITHUB_ENV"
          python3 scripts/patch_assets.py
          python3 scripts/build_index.py
          test -f public/index.html
          test -f "public/assets/releases/$CLOUD_MIRROR_RELEASE/detail-DFXDSk4X.js"
          grep -q "/assets/releases/$CLOUD_MIRROR_RELEASE/manifest-36336048.js" public/index.html
          # Safety: no remaining cloud PI host in primary bundles
          ! grep -R "https://pi.plane.so" public/assets/root-*.js public/assets/entry.client-*.js || (echo "PI host still present" && exit 1)
          ! grep -R "https://api.plane.so" public/assets/root-*.js public/assets/entry.client-*.js || (echo "API host still present" && exit 1)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deployments/cloud-web-mirror
          file: deployments/cloud-web-mirror/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plane-web:cloud-mirror-v25
            ghcr.io/${{ github.repository_owner }}/plane-web:cloud-mirror-v24
            ghcr.io/${{ github.repository_owner }}/plane-web:cloud-mirror-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/plane-web:preview-mirror

      - name: Verify epic tour fallbacks + media in image context
        working-directory: deployments/cloud-web-mirror
        run: |
          set -e
          # Prefer cache-busted V6 chunk; also accept any patched epic-migration modal
          grep -R -q "Epics is now a work item type" public/assets/epic-migration-*.js
          grep -R -q "||F\\[e\\].title" public/assets/epic-migration-*.js
          test -f public/assets/epic-migration-V6i18n.js
          test -f public/assets/manifest-36336048.js
          test -f public/epic-migration/step-1.gif
          test -f public/epic-migration/step-2.webp
          test -f public/epic-migration/step-3.webp
          test -s public/epic-migration/step-1.gif
          grep -q "manifest-36336048" public/index.html
          test -f public/assets/en-i18n-fallbacks-v7.js
          test -f public/assets/tip-download-app-dark-v7.webp
          grep -q "en-i18n-fallbacks-v7" public/index.html
          grep -q "stickies.empty_state.simple" public/assets/en-i18n-fallbacks-v7.js
          test -f public/tour/work-item/step-0-dark.webp
          test -f public/assets/material-symbols-rounded-latin-400-normal-9p3s809g.woff2
          grep -q "i18n-gate" public/index.html
          grep -qE "v1[0-9]-|preload-i18n|states-i18n|assets-mime" public/index.html
          test -f public/assets/modules-dark-Bs9zHyrm.webp
          test -f public/assets/unauthorized-C8vOPqGE.svg
          test -f public/tips/download-app/download-app-light.webp
          test -f public/tips/download-app/light.webp
          # AI grey-screen surgical patches present
          grep -q "s=!0,c=!0" public/assets/detail-DFXDSk4X.js
          grep -q 'e._result?.default||(()=>null)' public/assets/chunk-IJF3QNGC-D_ocRA8b.js
          grep -q "inject.js?v=34" public/index.html
          # At least 100 static media files shipped (empty-state illustrations)
          media_count=$(find public/assets -maxdepth 1 \( -name '*.webp' -o -name '*.png' -o -name '*.svg' -o -name '*.gif' \) | wc -l | tr -d ' ')
          test "$media_count" -ge 100

      - name: Mirror to ttl.sh
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/${{ github.repository_owner }}/plane-web:cloud-mirror-v25
          docker tag ghcr.io/${{ github.repository_owner }}/plane-web:cloud-mirror-v25 ttl.sh/cosmicboosts-plane-web:cloud-mirror-v25
          docker tag ghcr.io/${{ github.repository_owner }}/plane-web:cloud-mirror-v25 ttl.sh/cosmicboosts-plane-web:cloud-mirror-v24
          docker push ttl.sh/cosmicboosts-plane-web:cloud-mirror-v25
          docker push ttl.sh/cosmicboosts-plane-web:cloud-mirror-v24
