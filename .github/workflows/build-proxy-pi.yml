name: Build proxy with PI routes
on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - "deployments/cosmic-proxy/**"
      - ".github/workflows/build-proxy-pi.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deployments/cosmic-proxy
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plane-proxy:pi-v16
            ghcr.io/${{ github.repository_owner }}/plane-proxy:pi-v15
            ghcr.io/${{ github.repository_owner }}/plane-proxy:commercial-compat-v6
      - name: ttl.sh
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/${{ github.repository_owner }}/plane-proxy:pi-v16
          docker tag ghcr.io/${{ github.repository_owner }}/plane-proxy:pi-v16 ttl.sh/cosmicboosts-plane-proxy:pi-v16
          docker tag ghcr.io/${{ github.repository_owner }}/plane-proxy:pi-v16 ttl.sh/cosmicboosts-plane-proxy:pi-v15
          docker tag ghcr.io/${{ github.repository_owner }}/plane-proxy:pi-v16 ttl.sh/cosmicboosts-plane-proxy:commercial-compat-v6
          docker push ttl.sh/cosmicboosts-plane-proxy:pi-v16
          docker push ttl.sh/cosmicboosts-plane-proxy:pi-v15
          docker push ttl.sh/cosmicboosts-plane-proxy:commercial-compat-v6
